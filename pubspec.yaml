name: ayurliv_dashboard
description: Ayurlive Dashboard Flutter App
publish_to: 'none'
#version: 1.0.2+3
 
#ios version
version: 1.0.2+2
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  #Sshared_preferences: ^2.3.2
  shared_preferences: ^2.5.5

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Charts — fl_chart
  fl_chart: ^0.69.2

  # Networking
  dio: ^5.7.0

  # Dependency injection
  auto_injector: ^2.0.5

  # UI helpers
  gap: ^3.0.1
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  flutter_widget_from_html_core: ^0.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true    # ← the key line for iOS
  background_color_ios: "#FFFFFF"

flutter:
  uses-material-design: true

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-ExtraBold.ttf
          weight: 800
